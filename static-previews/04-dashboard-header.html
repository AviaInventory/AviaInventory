<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>04 Dashboard header</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f5;color:#16232b;font:14px Arial}.wrap{max-width:1100px;margin:auto;padding:24px 16px}.head{display:flex;gap:18px;align-items:flex-end;justify-content:space-between;border-bottom:1px solid #d7dee1;padding-bottom:20px}.title{min-width:0}.actions{width:auto;display:flex;gap:8px}.btn{min-height:44px;padding:10px 16px;border-radius:10px;font-weight:800;border:1px solid #d7dee1;background:#fff}.primary{background:#c48a3a;color:#fff;border-color:#c48a3a}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}.stat{background:#fff;border:1px solid #d7dee1;border-radius:14px;padding:20px}@media(max-width:640px){.head{display:block}.actions{width:100%;margin-top:16px}.btn{flex:1}.stats{grid-template-columns:1fr 1fr}}</style><main class="wrap"><div class="head"><div class="title"><small style="font:700 10px monospace;color:#1f5a78">BUYER CONTROL</small><h1 style="margin:5px 0">Procurement workspace</h1><p style="color:#64727a">Source parts, compare supplier responses and track every order.</p></div><div class="actions"><button class="btn">⌕ Find parts</button><button class="btn primary">＋ New RFQ</button></div></div><div class="stats"><div class="stat"><b>Open RFQs</b><h2>14</h2></div><div class="stat"><b>Orders</b><h2>6</h2></div><div class="stat"><b>Saved parts</b><h2>23</h2></div><div class="stat"><b>Messages</b><h2>4</h2></div></div></main>
